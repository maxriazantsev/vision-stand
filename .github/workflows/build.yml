name: Build and publish image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vision-stand:${{ github.event.release.tag_name }}
          build-args: VERSION=${{ github.event.release.tag_name }}

      - name: Report image size
        run: |
          docker image inspect ghcr.io/${{ github.repository_owner }}/vision-stand:${{ github.event.release.tag_name }} \
            --format '{{.Size}}' | awk '{printf "Image size: %.1f MB\n", $1/1024/1024}' >> "$GITHUB_STEP_SUMMARY"
